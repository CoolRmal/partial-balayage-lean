name: Integrate the actual checked square source

# Dispatch and source transition require the exact full numerical run to pass.
# The integration commit must contain the four reviewed draft modules.
# The 106 leaf files may be absent there or may have original proof routes;
# only the already validated exact candidate sources are applied in isolation.
on:
  workflow_dispatch:
    inputs:
      integration_commit:
        description: Full public integration source SHA after numerical full PASS
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  NUMERICAL_COMMIT: dde634e918bcbba00881018b205dea4172d2ee5f
  CONTROL_COMMIT: 243a5bd4f80c9517e7c9f834e85c5154eeb8e9a9
  NUMERICAL_RUN: "37409981058"

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Require the actual complete numerical run to pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo, runid = os.environ["REPOSITORY"], os.environ["NUMERICAL_RUN"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path]))
          run = api(f"repos/{repo}/actions/runs/{runid}")
          assert run["id"] == 37409981058
          assert run["head_sha"] == os.environ["CONTROL_COMMIT"]
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["event"] == "workflow_dispatch"
          assert run["path"] == ".github/workflows/square-numerical-checks.yml"
          jobs = api(f"repos/{repo}/actions/runs/{runid}/jobs?per_page=100")["jobs"]
          expected = {"Build and audit shared square dependencies",
                      "Restore and audit all 106 checked numerical modules"}
          expected |= {f"Ordinary kernel checks, blocks {n}–{min(n+5,105)}"
                       for n in range(0,106,6)}
          assert len(jobs) == 20
          assert {j["name"] for j in jobs} == expected
          assert all(j["status"] == "completed" and j["conclusion"] == "success" for j in jobs)
          (Path(os.environ["RUNNER_TEMP"]) / "source-run.json").write_text(
              json.dumps(run, indent=2) + "\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.NUMERICAL_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.NUMERICAL_RUN }}
          name: square-numerical-warm-${{ env.NUMERICAL_COMMIT }}
          path: ${{ runner.temp }}/square-numerical-merge/warm
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.NUMERICAL_RUN }}
          pattern: square-numerical-outputs-*-${{ env.NUMERICAL_COMMIT }}
          path: ${{ runner.temp }}/square-numerical-merge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CONTROL_COMMIT }}
          path: .square-control
          persist-credentials: false
      - name: Restore only the exact source-checked proof output bundles
        run: >-
          python3 .square-control/scripts/bundle-generator-outputs.py restore-all
          --download-dir "$RUNNER_TEMP/square-numerical-merge"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .integration-control
          persist-credentials: false
      - name: Check and apply the isolated source transition
        env:
          INTEGRATION_COMMIT: ${{ inputs.integration_commit }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          commit = os.environ["INTEGRATION_COMMIT"]
          assert re.fullmatch(r"[0-9a-f]{40}", commit)
          subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", commit], check=True)
          PY
          python3 .integration-control/scripts/prepare-square-integration.py \
            --integration-commit "$INTEGRATION_COMMIT" \
            --run-metadata "$RUNNER_TEMP/source-run.json" --apply-after-full-pass
      - name: Prepare only the explicitly ordered support modules
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, time
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "square-numerical"
          plan = json.loads((out / "integration-source-report.json").read_text())
          assert plan["status"] == "applied"
          assert plan["candidate"] == os.environ["NUMERICAL_COMMIT"]
          assert plan["control"] == os.environ["CONTROL_COMMIT"]
          assert plan["numerical_run"] == int(os.environ["NUMERICAL_RUN"])
          assert subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() == plan["integration_commit"]
          graph = plan["support_preparation"]["graph"]
          modules = plan["support_preparation"]["support_modules"]
          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def check_leaves():
              for path, expected in plan["protected_leaf_outputs"].items():
                  assert digest(path) == expected["sha256"], path
          for module, item in graph.items():
              assert digest(item["path"]) == item["sha256"], module
          check_leaves()
          logs = out / "support-logs"
          logs.mkdir(exist_ok=False)
          report = {"status": "preparing", "integration_commit": plan["integration_commit"],
                    "modules": [], "protected_leaf_outputs": len(plan["protected_leaf_outputs"])}
          report_path = out / "support-build-report.json"
          report_path.write_text(json.dumps(report, indent=2) + "\n")
          for module in modules:
              item = graph[module]
              assert digest(item["path"]) == item["sha256"], module
              with (logs / (module + "-deps.log")).open("w") as log:
                  subprocess.run(["lake", "--no-build", "build", "+" + module + ":deps"],
                                 stdout=log, stderr=subprocess.STDOUT, check=True)
              started = time.monotonic()
              with (logs / (module + "-build.log")).open("w") as log:
                  subprocess.run(["/usr/bin/time", "-v", "-o", str(logs / (module + ".time")),
                                  "lake", "build", module],
                                 stdout=log, stderr=subprocess.STDOUT, check=True)
              assert digest(item["path"]) == item["sha256"], module
              report["modules"].append({"module": module, "source_sha256": item["sha256"],
                                        "wall_seconds": time.monotonic() - started,
                                        "build_log": str(logs / (module + "-build.log")),
                                        "resource_time": str(logs / (module + ".time"))})
              report_path.write_text(json.dumps(report, indent=2) + "\n")
          check_leaves()
          report["status"] = "prepared"
          report["restored_leaf_output_hashes_unchanged"] = True
          report_path.write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Build the four actual integration modules serially
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "square-numerical"
          modules = ["PartialBalayage.Maximal.Square.GeneratorLeafBlocks",
                     "PartialBalayage.Maximal.Square.GeneratorInteriorPositivity",
                     "PartialBalayage.Maximal.Square.SquarePositiveSource",
                     "PartialBalayage.Maximal.SquareWeakBounds"]
          for module in modules:
              name = module.rsplit(".",1)[1]
              with (out / (name + "-deps.log")).open("w") as log:
                  subprocess.run(["lake", "--no-build", "build", "+" + module + ":deps"],
                                 stdout=log, stderr=subprocess.STDOUT, check=True)
              with (out / (name + "-build.log")).open("w") as log:
                  subprocess.run(["lake", "build", module], stdout=log,
                                 stderr=subprocess.STDOUT, check=True)
          PY
      - name: Require every restored leaf output to remain unchanged
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "square-numerical"
          plan = json.loads((out / "integration-source-report.json").read_text())
          for path, expected in plan["protected_leaf_outputs"].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected["sha256"], path
          (out / "final-leaf-output-guard.json").write_text(json.dumps({
              "status": "unchanged", "outputs": len(plan["protected_leaf_outputs"]),
              "candidate": plan["candidate"], "integration_commit": plan["integration_commit"]
          }, indent=2) + "\n")
          PY
      - name: Audit the actual registry, source, and strict square endpoint
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "square-numerical"
          sq = "PartialBalayage.Maximal.Square."
          groups = {
              "registry": ("PartialBalayage.Maximal.Square.GeneratorInteriorPositivity", [
                  sq+"generatorLeafBlocks_valid", sq+"generatorPartitionLeaf_rectangle_eq",
                  sq+"generatorPartitionLeaf_valid", sq+"exists_generatorPartitionRectangle_contains",
                  sq+"generatorInteriorDensity_pos_on_ordered_interior"]),
              "source-final": ("PartialBalayage.Maximal.SquareWeakBounds", [
                  sq+"ae_squareGeneratorDensity_nonneg",
                  sq+"integral_kernel_generator_eq_squareSourceMeasure",
                  sq+"integrable_squareSourceMeasure_jumpMoment",
                  sq+"integral_kernel_generator_eq_squareCompensatedSource",
                  "PartialBalayage.Maximal.square_weakTypeConstant_lt_3_616"]),
          }
          permitted = {"propext", "Classical.choice", "Quot.sound"}
          pattern = re.compile(r"'([^']+)'\s+(?:depends on axioms:\s*\[([^]]*)\]|"
                               r"does not depend on any axioms)")
          report = {}
          for key, (module, names) in groups.items():
              path = out / (key + "-audit.lean")
              path.write_text("import " + module + "\n" + "\n".join(
                  "#print axioms " + n for n in names) + "\n")
              with (out / (key + "-audit.log")).open("w") as log:
                  subprocess.run(["lake", "env", "lean", str(path)], stdout=log,
                                 stderr=subprocess.STDOUT, check=True)
              text = (out / (key + "-audit.log")).read_text()
              assert not re.search(r"\b(?:error|warning):", text)
              found = {m.group(1): {a.strip() for a in (m.group(2) or "").split(",") if a.strip()}
                       for m in pattern.finditer(text)}
              assert set(found) == set(names)
              assert all(basis <= permitted for basis in found.values())
              report[key] = {name: sorted(found[name]) for name in names}
          (out / "final-imported-audits.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: square-integration-report-${{ inputs.integration_commit }}
          path: |
            ${{ runner.temp }}/source-run.json
            ${{ runner.temp }}/square-numerical/*.json
            ${{ runner.temp }}/square-numerical/*.log
            ${{ runner.temp }}/square-numerical/*-audit.lean
            ${{ runner.temp }}/square-numerical/support-logs/*
          if-no-files-found: warn
          retention-days: 14

# After PASS, root publishes the assembled exact 106 candidate files and the
# four actual proof modules, wires the sixteenth Challenge/Solution target, then
# dispatches the official independent full Palomar/comparator check from that SHA.
# The output cache is not supplied to that cold official verification.
