name = "partial_balayage"
version = "0.1.0"
defaultTargets = ["PartialBalayage", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "PartialBalayage"
globs = ["PartialBalayage", "PartialBalayage.+"]

[[lean_lib]]
name = "CenteredMaximal"
globs = ["CenteredMaximal.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
