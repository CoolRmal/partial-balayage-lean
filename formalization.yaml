# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: Two partial balayage principles for weak-type estimates
  description: >-
    A candidate Lean formalization of fifteen selected statements from Yongxi Lin's
    table of weak type (1,1) upper bounds for singular integrals and maximal operators.
    Bounds include
    full-vector complex-input Riesz, complex Beurling, full and traceless Frobenius
    Hessians, both projections, centred intervals and balls, and all six Poisson
    and heat maximal bounds. The strict planar square bound below 3.616 is excluded
    from the submitted scope at the human author's request.
  authors:
  - Yongxi Lin
  license: Apache-2.0
  responsible_maintainers:
  - Yongxi Lin
classification:
  arxiv: [math.CA]
  msc2020: [42B25, 42B20, 31B15]
sources:
- title: Two partial balayage principles for weak-type estimates
  authors: [Yongxi Lin]
  type: other
  id: https://coolrmal.github.io/articles/two-partial-balayage-principles/
  location: Abstract table and Section 4
  relationship: formalizes
  note: >-
    The live article accessed on 5 October 2026 is the source. Fifteen selected
    statements are formalized; the planar square bound below 3.616 is excluded.
- title: Centred maximal constants for cubes and Euclidean balls
  authors: [Yongxi Lin]
  type: other
  id: https://github.com/CoolRmal/centered-maximal-constant/tree/72c022ba09032b522c878cca2f9b6c68217d77ea
  relationship: adapts
  license: Apache-2.0
  note: >-
    The minimal source closure for interval and Euclidean-ball bounds is copied
    into CenteredMaximal, preserving authorship. This reuse is substantive and
    is not claimed as new proof work in this repository.
related_formalizations:
- id: https://github.com/CoolRmal/centered-maximal-constant/tree/72c022ba09032b522c878cca2f9b6c68217d77ea
  relationship: builds-on
  note: Supplies three already established maximal-operator bounds.
status:
  scope: >-
    The comparator has fifteen statements selected from the article's table: full-vector
    complex-input Riesz,
    complex Beurling, full and
    traceless Frobenius Hessians, both projections, centred intervals, planar
    and higher-dimensional Euclidean balls, and all six Poisson and heat maximal
    bounds. Every maximal statement quantifies over all integrable real inputs
    and all levels. Unique exact tangency parameters and elementary special
    formulas are proved. The complex singular-integral and projection statements
    quantify over genuine linear all-L¹ extensions agreeing with the actual L²
    Fourier operators. The Riesz statement has a genuine complex-linear extension
    on every complex L¹ input, with coefficient two from actual complex norm-capped
    Poisson balayage and physical full-vector gradient cancellation. The
    one-dimensional cube constant is retained because it defines the centred
    interval operator. The planar square target and its proof are outside the
    current scope. Ordinary CI, full cold official verification and Palomar
    registration remain pending for the revised public snapshot; earlier checks
    do not establish acceptance of this revision.
    Counts exclude the deliberate holes in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
  - method: agent
    models: [GPT-6]
    framework: Codex desktop
    tool_setup: Lean, Mathlib, collaborating agents, GitHub Actions and Lean Comparator
    cost:
      wall_time: not tracked
      spend_usd: not tracked
      hardware: local machine and GitHub Actions
    prompting_notes: >-
      The human author requested all table bounds, a separate mathlib project,
      continuous public commits, comparator checks and eventual registration.
      The author later directed removal of the planar square proof and a
      fifteen-statement submission, with the complete article table documented
      separately from the formalized scope.
  - method: manual
    models: []
    framework: n/a
    tool_setup: Human-authored mathematics and direction
    cost:
      wall_time: not tracked
      spend_usd: not tracked
      hardware: n/a
    prompting_notes: The human author supplied the source proofs and target selection.
  spend_usd: not tracked
  notes: Copied proofs retain their previously documented provenance.
fidelity:
  divergences: >-
    Fifteen selected statements are compared, including complex scalar Riesz
    input. Semigroup formulas use the exact proved unique parameters rather than
    rounded decimals. The strict planar square bound below 452 / 125, the
    published table value 3.616, is deliberately excluded. Its large arithmetic
    certificates made complete verification expensive. No planar square result
    is advertised as part of this submission.
review:
  status: self-assessed
  reviewers: []
  notes: >-
    Codex agents inspected the live source, dependency closure and statement
    fidelity. No external human review. Final Palomar review and registration
    have not occurred. CI evidence is recorded separately.
alignment:
  namespace: PartialBalayage
  statements:
  - source: Abstract table, Riesz transform
    lean: PartialBalayage.riesz_weakTypeConstant_le_two
    module: Solution
    status: proved
    note: >-
      Every positive dimension, full complex Euclidean vector and genuine complex-linear
      all-complex-L¹ extension, with coefficient two and no analytical certificate premise.
  - source: Abstract table, centred intervals
    lean: PartialBalayage.interval_weakTypeConstant_le_two
    module: Solution
    status: proved
    note: The one-dimensional cube definition is the centred interval operator.
  - source: Abstract table, Euclidean balls in dimension two
    lean: PartialBalayage.ball_weakTypeConstant_two_le_exp
    module: Solution
    status: proved
    note: Exact exp 1 upper bound.
  - source: Abstract table, Euclidean balls in dimensions at least three
    lean: PartialBalayage.ball_weakTypeConstant_le_rpow
    module: Solution
    status: proved
    note: Exact real-power bound with explicit dimension hypothesis.
  - source: Abstract table, heat maximal, every positive dimension
    lean: PartialBalayage.heat_weakTypeConstant_le_formula
    module: Solution
    status: proved
    note: Exact coefficient for every integrable input and every level.
  - source: Abstract table, Poisson maximal, every positive dimension
    lean: PartialBalayage.poisson_weakTypeConstant_le_formula
    module: Solution
    status: proved
    note: Exact coefficient for every integrable input and every level.
  - source: Abstract table, heat maximal, dimension two
    lean: PartialBalayage.heat_weakTypeConstant_two_le_exact
    module: Solution
    status: proved
    note: Exact coefficient for every integrable input and every level.
  - source: Abstract table, Poisson maximal, dimension two
    lean: PartialBalayage.poisson_weakTypeConstant_two_le_exact
    module: Solution
    status: proved
    note: Exact coefficient for every integrable input and every level.
  - source: Abstract table, heat maximal, dimension one
    lean: PartialBalayage.heat_weakTypeConstant_one_le_exact
    module: Solution
    status: proved
    note: Exact coefficient for every integrable input and every level.
  - source: Abstract table, Poisson maximal, dimension one
    lean: PartialBalayage.poisson_weakTypeConstant_one_le_exact
    module: Solution
    status: proved
    note: Exact coefficient for every integrable input and every level.
  - source: Abstract table, complex-input Beurling transform
    lean: PartialBalayage.beurling_weakTypeConstant_le_two
    module: Solution
    status: proved
    note: Full complex scalar input and coefficient two.
  - source: Abstract table, full Frobenius Hessian, dimension two
    lean: PartialBalayage.hessian_weakTypeConstant_two_le_exact
    module: Solution
    status: proved
    note: Exact coefficient 3 * sqrt 6 / 4.
  - source: Abstract table, full Frobenius Hessian, every dimension at least two
    lean: PartialBalayage.hessian_weakTypeConstant_le_formula
    module: Solution
    status: proved
    note: Exact optimized dimension-dependent coefficient.
  - source: Abstract table, traceless Frobenius Hessian
    lean: PartialBalayage.tracelessHessian_weakTypeConstant_le
    module: Solution
    status: proved
    note: Exact coefficient including the one-dimensional zero operator.
  - source: Abstract table, both gradient and Leray projections
    lean: PartialBalayage.projections_weakTypeConstants_le_exact
    module: Solution
    status: proved
    note: Both operators, actual complex Euclidean vectors and exact cubic-root coefficient.
acknowledgements: >-
  Built on Lean 4, Mathlib and Yongxi Lin's earlier centred-maximal proofs.
  Layout and verification scripts come from PalomarTemplate. Codex assisted
  the human author; no AI system is listed as an author.
